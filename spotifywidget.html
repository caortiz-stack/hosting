<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Premium OBS Optimized - Turbo Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VARIABLES CONFIGURABLES
           ========================================= */
        :root {
            --theme-color-1: #00AEFF; 
            --theme-color-2: #0062FF; 
            --frame-size: 320px; 
            --progress-width: 0%;
            --logo-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/d29b243e0d3a48bb7f7343639cd243b408616178/logosvg.png');
            --emblem-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/emblem3.png');
        }

        body {
            margin: 0;
            padding: 80px; 
            background-color: transparent; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* CONTENEDOR PRINCIPAL - Composición por Hardware */
        .main-container {
            display: inline-flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-20px) translateZ(0);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .main-container.active {
            opacity: 1;
            transform: translateX(0) translateZ(0);
        }

        /* =========================================
           SECCIÓN LOGO / PORTADA (IZQUIERDA)
           ========================================= */
        .logo-frame-section {
            position: relative;
            width: var(--frame-size);
            height: var(--frame-size);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
            /* Animación suavizada para GPU */
            animation: global-glow 6s ease-in-out infinite;
            will-change: filter;
        }

        @keyframes global-glow {
            0%, 100% { filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4)) drop-shadow(0 0 5px rgba(0, 174, 255, 0.2)); }
            50% { filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)) drop-shadow(0 0 15px rgba(0, 174, 255, 0.4)); }
        }

        .logo-base-back {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 1;
            transform: translateZ(0);
        }

        .logo-frame-section::after {
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 2;
            opacity: 0;
            mix-blend-mode: color-dodge;
            animation: border-shimmer 8s ease-in-out infinite;
            filter: brightness(2.5) contrast(1.2) blur(1px);
            pointer-events: none;
            will-change: opacity;
        }

        @keyframes border-shimmer {
            0%, 100% { opacity: 0; }
            25% { opacity: 0.6; }
        }

        .inner-cover-circle {
            position: absolute;
            width: 61.2%; 
            height: 61.2%;
            border-radius: 50%;
            overflow: hidden; 
            z-index: 10; 
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transform: translateZ(0);
        }

        .album-cover {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            transition: background-image 0.8s ease-out;
            will-change: background-image;
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .spectrum-container {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) translateZ(0);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 80%;
            height: 40px;
            backface-visibility: hidden;
        }

        .bar {
            width: 3.5px;
            height: 30px;
            background: linear-gradient(to bottom, var(--theme-color-1), var(--theme-color-2));
            border-radius: 2px;
            transform: scaleY(0.3) translateZ(0);
            animation: spectrum-jump 0.8s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(0, 174, 255, 0.5);
            will-change: transform;
        }

        @keyframes spectrum-jump {
            0%, 100% { transform: scaleY(0.3) translateZ(0); opacity: 0.4; }
            50% { transform: scaleY(1) translateZ(0); opacity: 1; }
        }

        .glass-highlight {
            position: absolute;
            width: 61.8%;
            height: 61.8%;
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--theme-color-1), var(--theme-color-2), var(--theme-color-1)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.3);
            transform: translateZ(0);
        }

        /* =========================================
           SECCIÓN INFO (DERECHA)
           ========================================= */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 40px 20px 55px; 
            position: relative;
            border-left: 1px solid rgba(255,255,255,0.1);
            overflow: visible;
            transform: translateZ(0);
        }

        .artist-name {
            font-size: 21px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--theme-color-1), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0, 174, 255, 0.3));
        }

        .song-title {
            font-size: 46px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 30px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: visible;
            word-wrap: break-word;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 98, 255, 0.15);
            transition: font-size 0.3s ease;
            max-width: 580px;
        }

        /* BARRA DE PROGRESO CON EMBLEMA ESTÁTICO */
        .progress-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            min-width: 400px;
            position: relative;
            transform: translateZ(0);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .progress-bar-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: var(--progress-width);
            background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2));
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 174, 255, 0.5);
            transition: width 1.1s linear; 
            will-change: width;
            z-index: 1;
        }

        /* EMBLEMA ESTÁTICO BLANCO - Optimizado */
        .progress-emblem {
            position: absolute;
            right: -16px; 
            top: 50%;
            transform: translateY(-50%) translateZ(0);
            width: 32px;
            height: 32px;
            background: var(--emblem-url) center/contain no-repeat;
            z-index: 5;
            filter: brightness(0) invert(1);
            backface-visibility: hidden;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.5px;
        }

        /* CONFIGURACIÓN */
        .settings-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            justify-content: center; align-items: center;
        }
        .settings-overlay.show { display: flex; }
        .settings-modal { background: #111; padding: 25px; border-radius: 20px; width: 300px; color: #fff; border: 1px solid #222; }
        .close-btn { background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2)); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="main-container" id="main-widget">
        <!-- LOGO Y PORTADA -->
        <div class="logo-frame-section">
            <div class="logo-base-back"></div>
            <div class="inner-cover-circle">
                <div class="album-cover" id="cover"></div>
                <div class="cover-overlay"></div>
                <!-- ESPECTRO - GPU Optimizado -->
                <div class="spectrum-container">
                    <div class="bar" style="animation-duration: 0.75s; animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-duration: 0.9s; animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-duration: 0.65s; animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-duration: 1.1s; animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-duration: 0.85s; animation-delay: 0.4s"></div>
                    <div class="bar" style="animation-duration: 1.0s; animation-delay: 0.6s"></div>
                    <div class="bar" style="animation-duration: 0.8s; animation-delay: 0.15s"></div>
                    <div class="bar" style="animation-duration: 0.95s; animation-delay: 0.35s"></div>
                </div>
            </div>
            <div class="glass-highlight"></div>
        </div>

        <div class="info-section">
            <div class="artist-name" id="artist-text">...</div>
            <div class="song-title" id="title-text">Cargando...</div>
            
            <div class="progress-row">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar-fill">
                        <div class="progress-emblem"></div>
                    </div>
                </div>
                <div class="time-labels">
                    <span id="time-start">00:00</span>
                    <span id="time-end">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL CONFIG -->
    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-modal">
            <h3 style="margin-top:0; color:var(--theme-color-1); font-size: 18px; text-align: center;">⚙️ CONFIGURACIÓN</h3>
            <div style="margin-bottom:15px">
                <label style="font-size:12px;color:#aaa">Color Primario</label>
                <input type="color" id="set-color1" value="#00AEFF" style="width:100%;height:38px;border:none;border-radius:6px;background:#222;cursor:pointer">
            </div>
            <div style="margin-bottom:15px">
                <label style="font-size:12px;color:#aaa">Color Secundario</label>
                <input type="color" id="set-color2" value="#0062FF" style="width:100%;height:38px;border:none;border-radius:6px;background:#222;cursor:pointer">
            </div>
            <button class="close-btn" id="close-settings">GUARDAR Y APLICAR</button>
        </div>
    </div>

    <script>
        const LASTFM_USER = "imeachsd"; 
        const LASTFM_API_KEY = "4a9f5581a9cdf20a699f540ac52a95c9"; 
        const REFRESH_RATE = 2000;

        const widget = document.getElementById('main-widget');
        const cover = document.getElementById('cover');
        const artistEl = document.getElementById('artist-text');
        const titleEl = document.getElementById('title-text');
        const timeStartEl = document.getElementById('time-start');
        const timeEndEl = document.getElementById('time-end');

        let currentSongId = "";
        let isTransitioning = false;
        let progressInterval = null;
        let currentProgressMs = 0;

        function fmtTime(ms) {
            const s = Math.floor(ms / 1000);
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        async function preloadImage(url) {
            if (!url) return null;
            return new Promise((res) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => res(url);
                img.onerror = () => res(null);
                img.src = url;
            });
        }

        function loadSettings() {
            const root = document.documentElement.style;
            const c1 = localStorage.getItem('p_c1') || '#00AEFF';
            const c2 = localStorage.getItem('p_c2') || '#0062FF';
            document.getElementById('set-color1').value = c1;
            document.getElementById('set-color2').value = c2;
            root.setProperty('--theme-color-1', c1);
            root.setProperty('--theme-color-2', c2);
        }

        document.getElementById('close-settings').onclick = () => {
            const c1 = document.getElementById('set-color1').value;
            const c2 = document.getElementById('set-color2').value;
            localStorage.setItem('p_c1', c1);
            localStorage.setItem('p_c2', c2);
            document.documentElement.style.setProperty('--theme-color-1', c1);
            document.documentElement.style.setProperty('--theme-color-2', c2);
            document.getElementById('settings-overlay').classList.remove('show');
        };

        document.body.ondblclick = () => document.getElementById('settings-overlay').classList.add('show');
        loadSettings();

        // Limpieza de scripts inyectados para optimizar memoria
        async function getDeezerArt(title, artist) {
            return new Promise((res) => {
                const q = encodeURIComponent(`artist:"${artist}" track:"${title}"`);
                const callbackName = 'dz_' + Math.random().toString(36).substr(2, 9);
                const s = document.createElement('script');
                s.id = callbackName;
                window[callbackName] = (d) => {
                    const script = document.getElementById(callbackName);
                    if (script) script.remove();
                    delete window[callbackName];
                    if (d.data && d.data[0]) {
                        res({ url: d.data[0].album.cover_xl, dur: d.data[0].duration * 1000 });
                    } else res(null);
                };
                s.src = `https://api.deezer.com/search?q=${q}&limit=1&output=jsonp&callback=${callbackName}`;
                document.body.appendChild(s);
                // Garbage collection preventivo
                setTimeout(() => {
                    if (window[callbackName]) {
                        const script = document.getElementById(callbackName);
                        if (script) script.remove();
                        delete window[callbackName];
                        res(null);
                    }
                }, 5000);
            });
        }

        function startProgress(dur) {
            clearInterval(progressInterval);
            currentProgressMs = 0;
            timeEndEl.innerText = fmtTime(dur);
            progressInterval = setInterval(() => {
                currentProgressMs += 1000;
                const p = Math.min(1, currentProgressMs / dur);
                document.documentElement.style.setProperty('--progress-width', `${p * 100}%`);
                timeStartEl.innerText = fmtTime(currentProgressMs);
                if (p >= 1) clearInterval(progressInterval);
            }, 1000);
        }

        async function updateWidget(isPlaying, title, artist, fallbackImg) {
            if (isTransitioning) return;
            const newId = `${title}-${artist}`.toLowerCase();

            if (isPlaying && currentSongId !== newId) {
                isTransitioning = true;
                clearInterval(progressInterval);
                document.documentElement.style.setProperty('--progress-width', '0%');
                currentSongId = newId;

                const dzData = await getDeezerArt(title, artist);
                const finalImg = await preloadImage(dzData?.url || fallbackImg || 'https://via.placeholder.com/300');
                
                artistEl.innerText = artist;
                titleEl.innerText = title;
                
                const len = title.length;
                titleEl.style.fontSize = len > 50 ? "30px" : len > 35 ? "38px" : "46px";

                if (finalImg) cover.style.backgroundImage = `url('${finalImg}')`;
                widget.classList.add('active');

                if (dzData?.dur) startProgress(dzData.dur);
                else { timeStartEl.innerText = "00:00"; timeEndEl.innerText = "--:--"; }
                
                isTransitioning = false;
            } else if (!isPlaying && currentSongId !== "") {
                isTransitioning = true;
                clearInterval(progressInterval);
                widget.classList.remove('active');
                setTimeout(() => { currentSongId = ""; isTransitioning = false; }, 800);
            }
        }

        async function fetchMusic() {
            try {
                const r = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=1`);
                const d = await r.json();
                const t = d.recenttracks?.track?.[0];
                if (t && t['@attr']?.nowplaying === 'true') {
                    updateWidget(true, t.name, t.artist['#text'], t.image?.[t.image.length-1]?.['#text']);
                } else {
                    updateWidget(false);
                }
            } catch (e) { }
        }

        fetchMusic();
        setInterval(fetchMusic, REFRESH_RATE);
    </script>
</body>
</html>

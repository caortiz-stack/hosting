<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Premium OBS Overlay - HD Spaced Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VARIABLES CONFIGURABLES
           ========================================= */
        :root {
            --theme-color-1: #00AEFF; 
            --theme-color-2: #0062FF; 
            --progress-width: 0%;
            --logo-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/d29b243e0d3a48bb7f7343639cd243b408616178/logosvg.png');
            --emblem-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/emblem3.png');
            
            /* TAMAÑO COMPACTO PARA ESQUINA */
            --widget-scale: 150px; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* CONTENEDOR PRINCIPAL - Ajustado el espacio (GAP) */
        .main-container {
            display: inline-flex;
            align-items: center;
            padding: 30px; 
            gap: 35px; /* Incrementado para alejar el separador del logo */
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-container.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* =========================================
           SECCIÓN LOGO (RESPLANDOR SUTIL)
           ========================================= */
        .logo-section {
            position: relative;
            width: var(--widget-scale);
            height: var(--widget-scale);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: glow-pulse 5s ease-in-out infinite;
            will-change: filter;
        }

        @keyframes glow-pulse {
            0%, 100% { 
                filter: drop-shadow(0 0 5px rgba(0, 174, 255, 0.2)) 
                        drop-shadow(0 0 2px rgba(0, 98, 255, 0.1)); 
            }
            50% { 
                filter: drop-shadow(0 0 12px rgba(0, 174, 255, 0.4)) 
                        drop-shadow(0 0 8px rgba(0, 98, 255, 0.2)); 
            }
        }

        .logo-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
        }

        .logo-shimmer {
            position: absolute;
            width: 100%; height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 2;
            opacity: 0;
            filter: brightness(1.8) blur(0.3px);
            animation: border-shine 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes border-shine {
            0%, 100% { opacity: 0; }
            20%, 35% { opacity: 0.4; }
        }

        .cover-circle {
            position: absolute;
            width: 61.2%; 
            height: 61.2%;
            border-radius: 50%;
            overflow: hidden; 
            z-index: 10; 
            background-color: #000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        .album-cover {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0; left: 0;
            transition: background-image 0.8s ease-out;
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .spectrum-container {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 75%;
            height: 12px;
        }

        .bar {
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, var(--theme-color-1), var(--theme-color-2));
            border-radius: 1px;
            transform: scaleY(0.3);
            animation: spectrum-jump 0.8s infinite ease-in-out;
        }

        @keyframes spectrum-jump {
            0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
            50% { transform: scaleY(1); opacity: 0.8; }
        }

        .glass-ring {
            position: absolute;
            width: 61.8%;
            height: 61.8%;
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
            border: 1.2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.15);
        }

        /* =========================================
           SECCIÓN INFO (DERECHA)
           ========================================= */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px; /* Espacio después de la línea */
            border-left: 1px solid rgba(255,255,255,0.08); /* Este es el separador */
            overflow: visible;
        }

        .artist-name {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            background: linear-gradient(90deg, var(--theme-color-1), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 3px rgba(0, 174, 255, 0.2));
        }

        .song-title {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: visible;
            word-wrap: break-word;
            padding-right: 25px; 
            text-shadow: 
                0 2px 6px rgba(0, 0, 0, 0.8),
                0 3px 12px rgba(0, 0, 0, 0.4);
            max-width: 320px;
        }

        /* BARRA DE PROGRESO COMPACTA */
        .progress-container {
            width: 100%;
            position: relative;
            overflow: visible;
        }

        .progress-bg {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .progress-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: var(--progress-width);
            background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2));
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0, 174, 255, 0.4);
            transition: width 1.1s linear;
        }

        .emblem-marker {
            position: absolute;
            right: -9px;
            top: 50%;
            transform: translateY(-50%);
            height: 18px;
            width: 18px;
            background: var(--emblem-url) center/contain no-repeat;
            z-index: 5;
            filter: brightness(0) invert(1); 
            pointer-events: none;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.35);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* CONFIG MODAL */
        .config-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            justify-content: center; align-items: center;
        }
        .config-overlay.show { display: flex; }
        .config-card { background: #111; padding: 20px; border-radius: 12px; width: 260px; color: #fff; border: 1px solid #222; }
        .save-btn { background: var(--theme-color-1); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: 800; cursor: pointer; margin-top: 15px; }

    </style>
</head>
<body>

    <div class="main-container" id="main-widget">
        <!-- IZQUIERDA -->
        <div class="logo-section">
            <div class="logo-base"></div>
            <div class="logo-shimmer"></div>
            <div class="cover-circle">
                <div class="album-cover" id="cover"></div>
                <div class="cover-overlay"></div>
                <div class="spectrum-container">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
            </div>
            <div class="glass-ring"></div>
        </div>

        <!-- DERECHA -->
        <div class="info-section">
            <div class="artist-name" id="artist-text">...</div>
            <div class="song-title" id="title-text">Conectando...</div>
            
            <div class="progress-container">
                <div class="progress-bg">
                    <div class="progress-fill" id="bar-fill">
                        <div class="emblem-marker"></div>
                    </div>
                </div>
                <div class="time-row">
                    <span id="time-start">00:00</span>
                    <span id="time-end">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL CONFIG -->
    <div class="config-overlay" id="config-ui">
        <div class="config-card">
            <h3 style="text-align:center; font-size: 14px; margin-bottom: 15px;">ESTILO SUTIL</h3>
            <div style="margin-bottom:12px">
                <label style="font-size:9px;color:#888;text-transform:uppercase;">Color 1</label>
                <input type="color" id="c1" value="#00AEFF" style="width:100%;height:30px;border:none;border-radius:4px;cursor:pointer;background:#222;">
            </div>
            <div style="margin-bottom:12px">
                <label style="font-size:9px;color:#888;text-transform:uppercase;">Color 2</label>
                <input type="color" id="c2" value="#0062FF" style="width:100%;height:30px;border:none;border-radius:4px;cursor:pointer;background:#222;">
            </div>
            <button class="save-btn" id="save-cfg">GUARDAR</button>
        </div>
    </div>

    <script>
        const LASTFM_USER = "imeachsd"; 
        const LASTFM_API_KEY = "4a9f5581a9cdf20a699f540ac52a95c9"; 
        const REFRESH_RATE = 2000;

        const widget = document.getElementById('main-widget');
        const cover = document.getElementById('cover');
        const artistEl = document.getElementById('artist-text');
        const titleEl = document.getElementById('title-text');
        const timeStartEl = document.getElementById('time-start');
        const timeEndEl = document.getElementById('time-end');

        let currentId = "";
        let progressInterval = null;
        let currentMs = 0;

        function fmt(ms) {
            const s = Math.floor(ms / 1000);
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        async function preload(url) {
            if (!url) return null;
            return new Promise(res => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => res(url);
                img.onerror = () => res(null);
                img.src = url;
            });
        }

        function initCfg() {
            const root = document.documentElement.style;
            const savedC1 = localStorage.getItem('p_c1') || '#00AEFF';
            const savedC2 = localStorage.getItem('p_c2') || '#0062FF';
            root.setProperty('--theme-color-1', savedC1);
            root.setProperty('--theme-color-2', savedC2);
            document.getElementById('c1').value = savedC1;
            document.getElementById('c2').value = savedC2;
        }

        document.getElementById('save-cfg').onclick = () => {
            const c1 = document.getElementById('c1').value;
            const c2 = document.getElementById('c2').value;
            localStorage.setItem('p_c1', c1);
            localStorage.setItem('p_c2', c2);
            document.documentElement.style.setProperty('--theme-color-1', c1);
            document.documentElement.style.setProperty('--theme-color-2', c2);
            document.getElementById('config-ui').classList.remove('show');
        };

        document.body.ondblclick = () => document.getElementById('config-ui').classList.add('show');
        initCfg();

        async function getArt(title, artist) {
            return new Promise(res => {
                const q = encodeURIComponent(`artist:"${artist}" track:"${title}"`);
                const cb = 'dz_' + Date.now() + Math.floor(Math.random()*100);
                const s = document.createElement('script');
                window[cb] = (d) => {
                    s.remove();
                    delete window[cb];
                    if (d.data && d.data[0]) res({ url: d.data[0].album.cover_xl, dur: d.data[0].duration * 1000 });
                    else res(null);
                };
                s.src = `https://api.deezer.com/search?q=${q}&limit=1&output=jsonp&callback=${cb}`;
                document.body.appendChild(s);
            });
        }

        function runProgress(dur) {
            clearInterval(progressInterval);
            currentMs = 0;
            timeEndEl.innerText = fmt(dur);
            progressInterval = setInterval(() => {
                currentMs += 1000;
                const p = Math.min(1, currentMs / dur);
                document.documentElement.style.setProperty('--progress-width', `${p * 100}%`);
                timeStartEl.innerText = fmt(currentMs);
                if (p >= 1) clearInterval(progressInterval);
            }, 1000);
        }

        async function update(playing, title, artist, fallback) {
            const newId = (title + artist).toLowerCase();
            if (playing && currentId !== newId) {
                clearInterval(progressInterval);
                document.documentElement.style.setProperty('--progress-width', '0%');
                currentId = newId;

                const data = await getArt(title, artist);
                const imgUrl = await preload(data?.url || fallback || 'https://via.placeholder.com/300');
                
                artistEl.innerText = artist;
                titleEl.innerText = title;
                
                if (imgUrl) cover.style.backgroundImage = `url('${imgUrl}')`;
                widget.classList.add('active');

                if (data?.dur) runProgress(data.dur);
                else { timeStartEl.innerText = "00:00"; timeEndEl.innerText = "--:--"; }
            } else if (!playing && currentId !== "") {
                clearInterval(progressInterval);
                widget.classList.remove('active');
                setTimeout(() => { currentId = ""; }, 800);
            }
        }

        async function loop() {
            try {
                const r = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=1`);
                const d = await r.json();
                const t = d.recenttracks?.track?.[0];
                if (t && t['@attr']?.nowplaying === 'true') {
                    update(true, t.name, t.artist['#text'], t.image?.[t.image.length-1]?.['#text']);
                } else {
                    update(false);
                }
            } catch (e) {}
        }

        loop();
        setInterval(loop, REFRESH_RATE);
    </script>
</body>
</html>

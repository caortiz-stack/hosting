<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Premium OBS Overlay - HD Spaced Edition</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VARIABLES CONFIGURABLES
           ========================================= */
        :root {
            --theme-color-1: #00AEFF; 
            --theme-color-2: #0062FF; 
            --progress-width: 0%;
            --logo-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/d29b243e0d3a48bb7f7343639cd243b408616178/logosvg.png');
            --emblem-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/emblem3.png');
            
            /* TAMAÑO COMPACTO PARA ESQUINA */
            --widget-scale: 150px; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* CONTENEDOR PRINCIPAL - Ajustado el espacio (GAP) */
        .main-container {
            display: inline-flex;
            align-items: center;
            padding: 30px; 
            gap: 35px; /* Incrementado para alejar el separador del logo */
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-container.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* =========================================
           SECCIÓN LOGO (RESPLANDOR SUTIL)
           ========================================= */
        .logo-section {
            position: relative;
            width: var(--widget-scale);
            height: var(--widget-scale);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: glow-pulse 5s ease-in-out infinite;
            will-change: filter;
        }

        @keyframes glow-pulse {
            0%, 100% { 
                filter: drop-shadow(0 0 5px rgba(0, 174, 255, 0.2)) 
                        drop-shadow(0 0 2px rgba(0, 98, 255, 0.1)); 
            }
            50% { 
                filter: drop-shadow(0 0 12px rgba(0, 174, 255, 0.4)) 
                        drop-shadow(0 0 8px rgba(0, 98, 255, 0.2)); 
            }
        }

        .logo-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
        }

        .logo-shimmer {
            position: absolute;
            width: 100%; height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 2;
            opacity: 0;
            filter: brightness(1.8) blur(0.3px);
            animation: border-shine 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes border-shine {
            0%, 100% { opacity: 0; }
            20%, 35% { opacity: 0.4; }
        }

        .cover-circle {
            position: absolute;
            width: 61.2%; 
            height: 61.2%;
            border-radius: 50%;
            overflow: hidden; 
            z-index: 10; 
            background-color: #000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        /* Dos capas apiladas para hacer crossfade real entre portadas */
        .album-cover {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.8s ease-out;
            will-change: opacity;
        }
        .album-cover.layer-b { opacity: 0; }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .spectrum-container {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 75%;
            height: 12px;
        }

        .bar {
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, var(--theme-color-1), var(--theme-color-2));
            border-radius: 1px;
            transform: scaleY(0.3);
            animation: spectrum-jump 0.8s infinite ease-in-out;
            will-change: transform, opacity;
        }

        @keyframes spectrum-jump {
            0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
            50% { transform: scaleY(1); opacity: 0.8; }
        }

        /* OPTIMIZACION OBS: congela TODA animacion mientras el widget
           esta oculto. Sin esto, 7 animaciones siguen consumiendo GPU
           las 24 h aunque no se vea nada en pantalla. */
        .main-container:not(.active) .logo-section,
        .main-container:not(.active) .logo-shimmer,
        .main-container:not(.active) .bar {
            animation-play-state: paused;
        }

        .glass-ring {
            position: absolute;
            width: 61.8%;
            height: 61.8%;
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
            border: 1.2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.15);
        }

        /* =========================================
           SECCIÓN INFO (DERECHA)
           ========================================= */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px; /* Espacio después de la línea */
            border-left: 1px solid rgba(255,255,255,0.08); /* Este es el separador */
            overflow: visible;
        }

        .artist-name {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            background: linear-gradient(90deg, var(--theme-color-1), #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 3px rgba(0, 174, 255, 0.2));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .song-title {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            /* line-clamp EXIGE overflow hidden; con 'visible' el corte
               a 2 lineas no se aplicaba y los titulos largos se salian */
            overflow: hidden;
            overflow-wrap: break-word;
            /* El recorte necesario para line-clamp cortaba el text-shadow.
               Se agranda la caja de recorte y se compensa con margen
               negativo: el texto queda EXACTAMENTE en la misma posicion
               y el resplandor vuelve a verse completo. */
            margin-left: -24px;
            padding-left: 24px;
            padding-right: 25px;
            max-width: 344px;
            text-shadow: 
                0 2px 6px rgba(0, 0, 0, 0.8),
                0 3px 12px rgba(0, 0, 0, 0.4);
        }

        /* BARRA DE PROGRESO COMPACTA */
        .progress-container {
            width: 100%;
            position: relative;
            overflow: visible;
        }

        .progress-bg {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .progress-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: var(--progress-width);
            background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2));
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0, 174, 255, 0.4);
            transition: width 1.1s linear;
        }
        /* Al cambiar de cancion la barra vuelve a 0 sin animar hacia atras */
        .progress-fill.no-anim { transition: none; }

        .emblem-marker {
            position: absolute;
            right: -9px;
            top: 50%;
            transform: translateY(-50%);
            height: 18px;
            width: 18px;
            background: var(--emblem-url) center/contain no-repeat;
            z-index: 5;
            filter: brightness(0) invert(1); 
            pointer-events: none;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.35);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* CONFIG MODAL */
        .config-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            justify-content: center; align-items: center;
        }
        .config-overlay.show { display: flex; }
        .config-card { background: #111; padding: 20px; border-radius: 12px; width: 260px; color: #fff; border: 1px solid #222; }
        .save-btn { background: var(--theme-color-1); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: 800; cursor: pointer; margin-top: 15px; }

    </style>
</head>
<body>

    <div class="main-container" id="main-widget">
        <!-- IZQUIERDA -->
        <div class="logo-section">
            <div class="logo-base"></div>
            <div class="logo-shimmer"></div>
            <div class="cover-circle">
                <div class="album-cover" id="cover-a"></div>
                <div class="album-cover layer-b" id="cover-b"></div>
                <div class="cover-overlay"></div>
                <div class="spectrum-container">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
            </div>
            <div class="glass-ring"></div>
        </div>

        <!-- DERECHA -->
        <div class="info-section">
            <div class="artist-name" id="artist-text">...</div>
            <div class="song-title" id="title-text">Conectando...</div>
            
            <div class="progress-container">
                <div class="progress-bg">
                    <div class="progress-fill" id="bar-fill">
                        <div class="emblem-marker"></div>
                    </div>
                </div>
                <div class="time-row">
                    <span id="time-start">00:00</span>
                    <span id="time-end">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL CONFIG -->
    <div class="config-overlay" id="config-ui">
        <div class="config-card">
            <h3 style="text-align:center; font-size: 14px; margin-bottom: 15px;">ESTILO SUTIL</h3>
            <div style="margin-bottom:12px">
                <label style="font-size:9px;color:#888;text-transform:uppercase;">Color 1</label>
                <input type="color" id="c1" value="#00AEFF" style="width:100%;height:30px;border:none;border-radius:4px;cursor:pointer;background:#222;">
            </div>
            <div style="margin-bottom:12px">
                <label style="font-size:9px;color:#888;text-transform:uppercase;">Color 2</label>
                <input type="color" id="c2" value="#0062FF" style="width:100%;height:30px;border:none;border-radius:4px;cursor:pointer;background:#222;">
            </div>
            <button class="save-btn" id="save-cfg">GUARDAR</button>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        /* =======================================================
           CONFIGURACION
           ======================================================= */
        var LASTFM_USER    = "imeachsd";
        var LASTFM_API_KEY = "4a9f5581a9cdf20a699f540ac52a95c9";

        var REFRESH_RATE   = 4000;   // antes 2000. Ver nota al final.
        var FETCH_TIMEOUT  = 6000;   // corta peticiones colgadas
        var JSONP_TIMEOUT  = 5000;   // corta Deezer si no responde
        var ART_CACHE_MAX  = 40;     // portadas recordadas

        /* Portada de respaldo: SVG embebido, cero red.
           Antes se usaba via.placeholder.com, que ya no responde. */
        var FALLBACK_ART =
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
                '<rect width="300" height="300" fill="#0a0a0a"/>' +
                '<circle cx="150" cy="150" r="92" fill="none" stroke="#1b1b1b" stroke-width="13"/>' +
                '<circle cx="150" cy="150" r="20" fill="#1b1b1b"/></svg>'
            );

        /* Last.fm devuelve esta imagen comodin (estrella gris) cuando no
           tiene portada. Detectarla evita mostrar ese cuadro feo. */
        var LASTFM_BLANK = "2a96cbd8b46e442fc41c2b86b821562f";

        /* =======================================================
           REFERENCIAS DOM
           ======================================================= */
        var widget     = document.getElementById("main-widget");
        var coverA     = document.getElementById("cover-a");
        var coverB     = document.getElementById("cover-b");
        var artistEl   = document.getElementById("artist-text");
        var titleEl    = document.getElementById("title-text");
        var timeStart  = document.getElementById("time-start");
        var timeEnd    = document.getElementById("time-end");
        var barFill    = document.getElementById("bar-fill");
        var rootStyle  = document.documentElement.style;

        var currentId      = "";
        var progressTimer  = null;
        var trackStartedAt = 0;
        var trackDuration  = 0;
        var usingLayerA    = true;
        var inFlight       = false;   // evita peticiones solapadas
        var updateSeq      = 0;       // descarta respuestas viejas
        var artCache       = Object.create(null);
        var artCacheKeys   = [];

        /* =======================================================
           UTILIDADES
           ======================================================= */
        /* Avisa al log como MUCHO una vez por minuto por cada mensaje
           distinto. Sin esto, una caida de red escribiria una linea cada
           4 segundos y volveria a inflar el log de OBS. */
        var lastLog = Object.create(null);
        function logOnce(msg) {
            var now = Date.now();
            if (lastLog[msg] && now - lastLog[msg] < 60000) return;
            lastLog[msg] = now;
            console.warn(msg);
        }

        /* Timeout por carrera, SIN AbortController.
           En el navegador de OBS hay integraciones que reenvian fetch por
           postMessage; un AbortSignal no es clonable y pasar {signal}
           reventaba la peticion entera con
           "AbortSignal object could not be cloned".
           Por eso se llama a fetch(url) sin segundo argumento. */
        function fetchTimeout(url, ms) {
            return new Promise(function (resolve, reject) {
                var settled = false;
                var to = setTimeout(function () {
                    if (settled) return;
                    settled = true;
                    reject(new Error("sin respuesta en " + ms + " ms"));
                }, ms);
                function ok(r)  { if (settled) return; settled = true; clearTimeout(to); resolve(r); }
                function bad(e) { if (settled) return; settled = true; clearTimeout(to); reject(e); }
                try {
                    fetch(url).then(ok, bad);
                } catch (e) {
                    bad(e);
                }
            });
        }

        function fmt(ms) {
            if (!isFinite(ms) || ms < 0) ms = 0;
            var s = Math.floor(ms / 1000);
            var m = Math.floor(s / 60);
            return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        }

        /* ==== COINCIDENCIA DE PISTA : INICIO ==== */

        /* Palabras que marcan una VERSION distinta de la cancion.
           Si Deezer trae una que la peticion no pedia (un remix, un
           directo, una acustica), ese resultado se penaliza: su duracion
           no es la de la cancion que suena. */
        var QUALIFIERS = [
            "remix", "en vivo", "live", "directo", "acustica", "acustico",
            "acoustic", "instrumental", "karaoke", "demo", "alt take",
            "bonus", "radio edit", "remaster", "remasterizado", "cover",
            "noches de salon", "studio session", "session", "piano",
            "version", "mix", "edit", "unplugged", "vivo"
        ];

        function deaccent(s) {
            return String(s || "")
                .toLowerCase()
                /* Last.fm y Deezer no siempre coinciden en tildes
                   ("Organo" vs "Organo" con tilde, "Tu" vs "Tu" con tilde). */
                .normalize("NFD").replace(/[̀-ͯ]/g, "")
                .replace(/[‘’`´]/g, "'");
        }

        /* Nucleo del titulo: lo que de verdad identifica la cancion.
           "Danza de Ciudad (Studio Session)" -> "danza de ciudad"
           "Danza de Ciudad - Studio Session" -> "danza de ciudad"
           Asi las dos formas que usan Last.fm y Deezer coinciden. */
        function core(s) {
            return deaccent(s)
                .replace(/[\(\[][^\)\]]*[\)\]]/g, " ")   // quita parentesis
                .replace(/\s+-\s+.*$/, " ")              // quita lo que sigue a " - "
                .replace(/\s*(feat\.?|ft\.?)\s+.*$/, " ")
                .replace(/[^a-z0-9\s']/g, " ")           // quita puntuacion
                .replace(/\s+/g, " ")
                .trim();
        }

        /* Etiquetas de version presentes en el texto completo. */
        function quals(s) {
            var full = deaccent(s).replace(/[^a-z0-9\s']/g, " ").replace(/\s+/g, " ");
            var found = [];
            for (var i = 0; i < QUALIFIERS.length; i++) {
                if (full.indexOf(QUALIFIERS[i]) !== -1) found.push(QUALIFIERS[i]);
            }
            return found;
        }

        function qualPenalty(qQuery, qCand) {
            var pen = 0, i;
            for (i = 0; i < qCand.length; i++) {
                /* Deezer trae una etiqueta que no pedimos: version distinta. */
                if (qQuery.indexOf(qCand[i]) === -1) pen -= 3;
            }
            for (i = 0; i < qQuery.length; i++) {
                /* Pedimos una etiqueta que Deezer no tiene: menos grave. */
                if (qCand.indexOf(qQuery[i]) === -1) pen -= 1;
            }
            return pen;
        }

        /* Puntua un resultado de Deezer. Devuelve null si no es la cancion. */
        function scoreCandidate(cand, title, artist, qQuery) {
            var cA = core(cand.artist && cand.artist.name), qA = core(artist);
            var cT = core(cand.title),                      qT = core(title);
            if (!cA || !cT) return null;

            var sc = 0;
            if (cA === qA) sc += 3;
            else if (cA.indexOf(qA) !== -1 || qA.indexOf(cA) !== -1) sc += 1;
            else return null;                 // artista distinto: descartado

            if (cT === qT) sc += 4;
            else if (cT.indexOf(qT) !== -1 || qT.indexOf(cT) !== -1) sc += 2;
            else return null;                 // cancion distinta: descartada

            return sc + qualPenalty(qQuery, quals(cand.title));
        }

        /* Elige el mejor de los resultados de Deezer, no el primero.
           Buscando "Y La Esperanza" Deezer devuelve primero un remix de
           299 s; el original de 222 s viene despues. */
        function pickBest(list, title, artist) {
            if (!list || !list.length) return null;
            var qQuery = quals(title);
            var best = null, bestScore = -Infinity;
            for (var i = 0; i < list.length; i++) {
                var sc = scoreCandidate(list[i], title, artist, qQuery);
                if (sc === null) continue;
                if (sc > bestScore) { bestScore = sc; best = list[i]; }
            }
            return best;
        }

        /* ==== COINCIDENCIA DE PISTA : FIN ==== */

        function cacheArt(key, val) {
            if (!(key in artCache)) {
                artCacheKeys.push(key);
                if (artCacheKeys.length > ART_CACHE_MAX) {
                    delete artCache[artCacheKeys.shift()];
                }
            }
            artCache[key] = val;
        }

        /* Precarga la imagen antes de mostrarla: evita el parpadeo
           de un circulo negro mientras baja la portada. */
        function preload(url) {
            return new Promise(function (res) {
                if (!url) { res(null); return; }
                var img = new Image();
                var done = false;
                var to = setTimeout(function () {
                    if (!done) { done = true; img.src = ""; res(null); }
                }, FETCH_TIMEOUT);
                img.onload  = function () { if (!done) { done = true; clearTimeout(to); res(url); } };
                img.onerror = function () { if (!done) { done = true; clearTimeout(to); res(null); } };
                img.src = url;
            });
        }

        /* =======================================================
           PANEL DE COLORES  (doble clic)
           ======================================================= */
        function lsGet(k, d) {
            /* En OBS el almacenamiento puede lanzar excepcion segun la
               configuracion de la fuente. Sin try/catch, el widget
               moria antes de arrancar. */
            try { return localStorage.getItem(k) || d; } catch (e) { return d; }
        }
        function lsSet(k, v) {
            try { localStorage.setItem(k, v); } catch (e) { /* sin persistencia, no es fatal */ }
        }

        function initCfg() {
            var c1 = lsGet("p_c1", "#00AEFF");
            var c2 = lsGet("p_c2", "#0062FF");
            rootStyle.setProperty("--theme-color-1", c1);
            rootStyle.setProperty("--theme-color-2", c2);
            var i1 = document.getElementById("c1");
            var i2 = document.getElementById("c2");
            if (i1) i1.value = c1;
            if (i2) i2.value = c2;
        }

        document.getElementById("save-cfg").onclick = function () {
            var c1 = document.getElementById("c1").value;
            var c2 = document.getElementById("c2").value;
            lsSet("p_c1", c1); lsSet("p_c2", c2);
            rootStyle.setProperty("--theme-color-1", c1);
            rootStyle.setProperty("--theme-color-2", c2);
            document.getElementById("config-ui").classList.remove("show");
        };
        document.body.ondblclick = function () {
            document.getElementById("config-ui").classList.add("show");
        };
        initCfg();

        /* =======================================================
           PORTADA + DURACION (Deezer via JSONP)
           ======================================================= */
        function getArt(title, artist) {
            var key = core(artist) + "|" + core(title);
            if (key in artCache) return Promise.resolve(artCache[key]);

            return new Promise(function (res) {
                var cb = "dz_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
                var script = document.createElement("script");
                var settled = false;

                function finish(val) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    /* Limpieza COMPLETA. El original solo borraba el script
                       cuando Deezer respondia: cada fallo dejaba una etiqueta
                       y una funcion global colgados para siempre. */
                    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                    cacheArt(key, val);
                    res(val);
                }

                var timer = setTimeout(function () { finish(null); }, JSONP_TIMEOUT);

                window[cb] = function (d) {
                    var t = pickBest(d && d.data, title, artist);
                    if (!t) { finish(null); return; }
                    finish({
                        url: t.album && (t.album.cover_xl || t.album.cover_big || t.album.cover_medium),
                        dur: t.duration ? t.duration * 1000 : 0
                    });
                };

                script.onerror = function () { finish(null); };
                /* BUSQUEDA DE TEXTO LIBRE.
                   Deezer dejo de admitir la sintaxis avanzada
                   artist:"X" track:"Y": responde 200 con {"data":[],"total":0}
                   para TODO. Por eso el widget se quedo sin duracion ni
                   portada. El texto libre si funciona, y como puede traer
                   resultados ajenos, pickBest los filtra y puntua. */
                script.src = "https://api.deezer.com/search?q=" +
                             encodeURIComponent(artist + " " + title) +
                             "&limit=5&output=jsonp&callback=" + cb;
                document.body.appendChild(script);
            });
        }

        /* Respaldo de duracion: Last.fm track.getInfo.
           Cubre los casos en que Deezer no tiene la cancion o solo
           devuelve versiones ajenas (p.ej. "Tu Ganas" de Serbia). */
        var durCache = Object.create(null);
        function getLastfmDuration(title, artist) {
            var key = core(artist) + "|" + core(title);
            if (key in durCache) return Promise.resolve(durCache[key]);
            var url = "https://ws.audioscrobbler.com/2.0/?method=track.getInfo" +
                      "&api_key=" + encodeURIComponent(LASTFM_API_KEY) +
                      "&artist="  + encodeURIComponent(artist) +
                      "&track="   + encodeURIComponent(title) +
                      "&format=json";
            return fetchTimeout(url, FETCH_TIMEOUT)
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var ms = d && d.track && parseInt(d.track.duration, 10);
                    var val = (ms && ms > 1000) ? ms : 0;
                    durCache[key] = val;
                    return val;
                })
                .catch(function () { durCache[key] = 0; return 0; });
        }

        /* =======================================================
           BARRA DE PROGRESO
           ======================================================= */
        function stopProgress() {
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
        }

        function runProgress(dur) {
            stopProgress();
            trackDuration  = dur;
            trackStartedAt = Date.now();
            timeEnd.textContent = fmt(dur);

            progressTimer = setInterval(function () {
                /* Reloj real en vez de "currentMs += 1000".
                   setInterval se retrasa cuando OBS tiene carga, asi que
                   el contador anterior se desfasaba progresivamente del
                   tiempo real de la cancion. */
                var elapsed = Date.now() - trackStartedAt;
                var p = Math.min(1, elapsed / trackDuration);
                rootStyle.setProperty("--progress-width", (p * 100).toFixed(2) + "%");
                timeStart.textContent = fmt(Math.min(elapsed, trackDuration));
                if (p >= 1) stopProgress();
            }, 1000);
        }

        /* Sin duracion fiable no se puede dibujar la barra, pero si
           mostrar cuanto lleva sonando: mejor que un 00:00 congelado. */
        function runElapsedOnly() {
            stopProgress();
            trackStartedAt = Date.now();
            timeEnd.textContent = "--:--";
            progressTimer = setInterval(function () {
                timeStart.textContent = fmt(Date.now() - trackStartedAt);
            }, 1000);
        }

        function resetProgress() {
            stopProgress();
            barFill.classList.add("no-anim");
            rootStyle.setProperty("--progress-width", "0%");
            void barFill.offsetWidth;           // fuerza el repintado
            barFill.classList.remove("no-anim");
            timeStart.textContent = "00:00";
        }

        /* =======================================================
           CROSSFADE DE PORTADA
           ======================================================= */
        function setCover(url) {
            var incoming = usingLayerA ? coverB : coverA;
            var outgoing = usingLayerA ? coverA : coverB;
            incoming.style.backgroundImage = "url('" + url + "')";
            incoming.style.opacity = "1";
            outgoing.style.opacity = "0";
            usingLayerA = !usingLayerA;
        }

        /* =======================================================
           ACTUALIZACION PRINCIPAL
           ======================================================= */
        function show(title, artist, lastfmArt) {
            var newId = core(artist) + "|" + core(title);
            if (newId === currentId) return;      // misma cancion, nada que hacer
            currentId = newId;

            var seq = ++updateSeq;
            resetProgress();

            /* Texto primero: la cancion aparece al instante y la portada
               entra despues. Antes el widget esperaba a Deezer para
               mostrar incluso el nombre. */
            artistEl.textContent = artist || "";
            titleEl.textContent  = title  || "";
            timeEnd.textContent  = "--:--";
            widget.classList.add("active");

            getArt(title, artist).then(function (data) {
                if (seq !== updateSeq) return;    // ya suena otra cancion

                var lfm = lastfmArt && lastfmArt.indexOf(LASTFM_BLANK) === -1 ? lastfmArt : null;
                return preload((data && data.url) || lfm || null).then(function (ok) {
                    if (seq !== updateSeq) return;
                    setCover(ok || FALLBACK_ART);

                    if (data && data.dur) { runProgress(data.dur); return; }

                    /* Deezer no dio duracion: se prueba con Last.fm y, si
                       tampoco, al menos se cuenta el tiempo transcurrido. */
                    return getLastfmDuration(title, artist).then(function (ms) {
                        if (seq !== updateSeq) return;
                        if (ms) runProgress(ms); else runElapsedOnly();
                    });
                });
            }).catch(function () {
                if (seq !== updateSeq) return;
                setCover(FALLBACK_ART);
            });
        }

        function hide() {
            if (currentId === "") return;
            stopProgress();
            widget.classList.remove("active");
            currentId = "";
            rootStyle.setProperty("--progress-width", "0%");
        }

        /* =======================================================
           CONSULTA A LAST.FM
           ======================================================= */
        function poll() {
            if (inFlight) return;   /* Si la red va lenta, el original lanzaba
                                       una peticion nueva cada 2 s encima de la
                                       anterior y las respuestas llegaban
                                       desordenadas. */
            inFlight = true;

            var url = "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks" +
                      "&user="    + encodeURIComponent(LASTFM_USER) +
                      "&api_key=" + encodeURIComponent(LASTFM_API_KEY) +
                      "&format=json&limit=1";

            fetchTimeout(url, FETCH_TIMEOUT)
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (d) {
                    if (d && d.error) throw new Error("Last.fm " + d.error + ": " + d.message);

                    var t = d && d.recenttracks && d.recenttracks.track;
                    if (Array.isArray(t)) t = t[0];
                    if (!t) { hide(); return; }

                    var nowPlaying = t["@attr"] && t["@attr"].nowplaying;
                    nowPlaying = nowPlaying === true || nowPlaying === "true";

                    if (!nowPlaying) { hide(); return; }

                    /* GUARDA CONTRA EL BUG PRINCIPAL.
                       Si falta el titulo o el artista se sale aqui, en vez de
                       seguir y reventar al concatenar valores inexistentes. */
                    var title  = t.name;
                    var artist = t.artist && (t.artist["#text"] || t.artist.name);
                    if (!title || !artist) { hide(); return; }

                    var imgs = t.image;
                    var art = Array.isArray(imgs) && imgs.length
                              ? (imgs[imgs.length - 1] || {})["#text"]
                              : null;

                    show(String(title), String(artist), art);
                })
                .catch(function (e) {
                    /* Error de red o de API: se conserva en pantalla lo que ya
                       habia y se reintenta en el siguiente ciclo. */
                    logOnce("[widget] consulta fallida: " + (e && e.message ? e.message : e));
                })
                .then(function () {
                    inFlight = false;
                });
        }

        poll();
        setInterval(poll, REFRESH_RATE);

        /* OBS puede dejar la fuente en segundo plano: al volver a mostrarse
           se consulta de inmediato en vez de esperar el ciclo completo. */
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) poll();
        });
    })();
    </script>
</body>
</html>

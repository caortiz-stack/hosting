<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTG | Instituto Superior Tecnológico Guayaquil</title>

<link rel="icon" href="https://raw.githubusercontent.com/caortiz-stack/hosting/4d0023a4a1e80af12ac0c1725f64f702cc835788/Recurso%201.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/scrollreveal"></script>
</head>

<body>

<!-- ================= CURSOR ================= -->
<div id="cursor"></div>

<!-- ================= NAV ================= -->
<nav id="navbar">...</nav>
<!-- 🔹 NAV, HERO, CARRERAS, ADMISIONES, SOCIAL y FOOTER
     🔹 NO MODIFICADOS (idénticos a tu HTML original)
     🔹 OMITIDOS AQUÍ SOLO PARA NO DUPLICAR TEXTO
     🔹 EN TU ARCHIVO FINAL QUEDAN TAL CUAL -->
     
<!-- ================= SCRIPT OPTIMIZADO ================= -->
<script>
/* =========================
   SCROLL REVEAL
========================= */
const sr = ScrollReveal({
  origin: 'bottom',
  distance: '30px',
  duration: 1000,
  delay: 100
});
sr.reveal('.reveal-bottom');
sr.reveal('.reveal-left', { origin: 'left' });
sr.reveal('.reveal-right', { origin: 'right' });
sr.reveal('.reveal-item', { interval: 150 });

/* =========================
   CACHE DOM
========================= */
const navbar = document.getElementById('navbar');
const admisiones = document.getElementById('admisiones');
const processFill = document.getElementById('process-fill');

/* =========================
   SCROLL OPTIMIZADO
========================= */
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY > 50;

  navbar.style.padding = scrolled ? '10px 0' : '15px 0';
  navbar.style.boxShadow = scrolled
    ? '0 5px 20px rgba(0,0,0,0.1)'
    : 'none';

  if (admisiones.getBoundingClientRect().top < window.innerHeight / 1.3) {
    processFill.style.width = '100%';
  }
});

/* =========================
   DATA CARRERAS
========================= */
const careers = {
  diseno: {
    title: "Diseño Gráfico",
    desc: "No solo diseñes, crea realidades...",
    img: "https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/dise%C3%B1o.jpg",
    color: "#f97316",
    icon: "fa-pen-nib"
  },
  software: {
    title: "Desarrollo Software",
    desc: "Codifica el futuro...",
    img: "https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/desarrollo.jpg",
    color: "#1e3a8a",
    icon: "fa-code"
  },
  marketing: {
    title: "Marketing Digital",
    desc: "Hackea el algoritmo...",
    img: "https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/marketing.jpg",
    color: "#d946ef",
    icon: "fa-bullhorn"
  },
  contabilidad: {
    title: "Contabilidad",
    desc: "Estrategia financiera...",
    img: "https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/contabilidad.jpg",
    color: "#06b6d4",
    icon: "fa-calculator"
  }
};

/* =========================
   STATE
========================= */
let currentMain = 'diseno';
let stack = ['software', 'marketing', 'contabilidad'];

/* =========================
   CACHE MAIN
========================= */
const mainImg = document.getElementById('main-img');
const mainTitle = document.getElementById('main-title');
const mainDesc = document.getElementById('main-desc');
const mainIcon = document.getElementById('main-icon');
const mainCard = document.getElementById('main-card');

/* =========================
   SWAP LIMPIO
========================= */
function swapContent(index) {
  const newId = stack[index];
  const newData = careers[newId];
  const oldData = careers[currentMain];

  mainImg.style.opacity = '0';
  setTimeout(() => {
    mainImg.src = newData.img;
    mainImg.style.opacity = '1';
  }, 150);

  mainTitle.textContent = newData.title;
  mainDesc.textContent = newData.desc;
  mainIcon.className = `fa-solid ${newData.icon}`;
  mainIcon.style.color = newData.color;
  mainCard.style.setProperty('--card-color', newData.color);

  const stackTitle = document.getElementById(`stack-title-${index}`);
  const stackIcon = document.getElementById(`stack-icon-${index}`);
  const stackCard = document.getElementById(`stack-${index}`);

  stackTitle.textContent = oldData.title;
  stackIcon.className = `fa-solid ${oldData.icon}`;
  stackCard.style.setProperty('--card-color', oldData.color);

  stack[index] = currentMain;
  currentMain = newId;
}

/* =========================
   HERO CAROUSEL
========================= */
const heroImgs = document.querySelectorAll('.hero-img');
let heroIdx = 0;
if (heroImgs.length > 1) {
  setInterval(() => {
    heroImgs[heroIdx].classList.remove('active');
    heroIdx = (heroIdx + 1) % heroImgs.length;
    heroImgs[heroIdx].classList.add('active');
  }, 4000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium OBS Overlay - Pure Spotify Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           VARIABLES CONFIGURABLES
           ========================================= */
        :root {
            --theme-color-1: #00AEFF; 
            --theme-color-2: #0062FF; 
            --progress-width: 0%;
            --logo-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/d29b243e0d3a48bb7f7343639cd243b408616178/logosvg.png');
            --emblem-url: url('https://raw.githubusercontent.com/caortiz-stack/hosting/refs/heads/gh-pages/emblem3.png');
            
            /* TAMAÑO COMPACTO PARA ESQUINA (Optimizado HD) */
            --widget-scale: 150px; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            display: inline-flex;
            align-items: center;
            padding: 30px; 
            gap: 35px; 
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: visible;
        }

        .main-container.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* =========================================
           SECCIÓN LOGO (RESPLANDOR SUTIL HD)
           ========================================= */
        .logo-section {
            position: relative;
            width: var(--widget-scale);
            height: var(--widget-scale);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: glow-pulse 5s ease-in-out infinite;
            will-change: filter;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 174, 255, 0.2)) drop-shadow(0 0 2px rgba(0, 98, 255, 0.1)); }
            50% { filter: drop-shadow(0 0 12px rgba(0, 174, 255, 0.4)) drop-shadow(0 0 8px rgba(0, 98, 255, 0.2)); }
        }

        .logo-base {
            position: absolute;
            width: 100%; height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
        }

        .logo-shimmer {
            position: absolute;
            width: 100%; height: 100%;
            background: var(--logo-url) center/contain no-repeat;
            z-index: 2;
            opacity: 0;
            filter: brightness(1.8) blur(0.3px);
            animation: border-shine 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes border-shine {
            0%, 100% { opacity: 0; }
            20%, 35% { opacity: 0.4; }
        }

        .cover-circle {
            position: absolute;
            width: 61.2%; height: 61.2%;
            border-radius: 50%;
            overflow: hidden; 
            z-index: 10; 
            background-color: #000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        .album-cover {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0; left: 0;
            transition: background-image 0.8s ease-out;
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        .spectrum-container {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 75%; height: 12px;
        }

        .bar {
            width: 2px; height: 100%;
            background: linear-gradient(to bottom, var(--theme-color-1), var(--theme-color-2));
            border-radius: 1px;
            transform: scaleY(0.3);
            animation: spectrum-jump 0.8s infinite ease-in-out;
        }

        @keyframes spectrum-jump {
            0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
            50% { transform: scaleY(1); opacity: 0.8; }
        }

        .glass-ring {
            position: absolute;
            width: 61.8%; height: 61.8%;
            border-radius: 50%; z-index: 15; pointer-events: none;
            border: 1.2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.15);
        }

        /* =========================================
           SECCIÓN INFO (DERECHA)
           ========================================= */
        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px; 
            border-left: 1px solid rgba(255,255,255,0.08); 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .artist-name {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
            background: linear-gradient(90deg, var(--theme-color-1), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .song-title {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.2;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden; 
            word-wrap: break-word;
            padding-right: 5px; 
            padding-bottom: 5px; 
            margin-bottom: 7px;
            filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.9));
            max-width: 320px;
            transition: font-size 0.3s ease;
        }

        /* BARRA DE PROGRESO COMPACTA */
        .progress-container {
            width: 100%; position: relative; overflow: visible;
        }

        .progress-bg {
            width: 100%; height: 5px; background: rgba(255,255,255,0.06);
            border-radius: 8px; position: relative;
        }

        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            width: var(--progress-width);
            background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2));
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0, 174, 255, 0.4);
            transition: width 1.1s linear;
        }

        .emblem-marker {
            position: absolute; right: -9px; top: 50%;
            transform: translateY(-50%); height: 18px; width: 18px;
            background: var(--emblem-url) center/contain no-repeat;
            z-index: 5; filter: brightness(0) invert(1); pointer-events: none;
        }

        .time-row {
            display: flex; justify-content: space-between; font-size: 10px;
            font-weight: 700; color: rgba(255,255,255,0.4); margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* MODAL DE CONFIG AVANZADO */
        .config-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 9999; display: none;
            justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .config-overlay.show { display: flex; }
        .config-card { background: #111; padding: 25px; border-radius: 12px; width: 340px; color: #fff; border: 1px solid #333; max-height: 90vh; overflow-y: auto;}
        .config-card h4 { margin: 15px 0 5px 0; font-size: 11px; color: var(--theme-color-1); text-transform: uppercase;}
        .config-input { width: 100%; height: 35px; border: 1px solid #333; border-radius: 4px; background: #222; color: #fff; padding: 0 10px; font-family: 'Poppins', sans-serif; margin-bottom: 10px; font-size: 11px; outline: none; }
        .config-input:focus { border-color: var(--theme-color-1); }
        .config-color { width: 100%; height: 35px; border: none; border-radius: 4px; cursor: pointer; background: #222; margin-bottom: 10px;}
        .btn-spotify { background: #1DB954; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 800; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        .btn-spotify:hover { filter: brightness(1.1); }
        .save-btn { background: linear-gradient(90deg, var(--theme-color-1), var(--theme-color-2)); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        
        #spotify-status-box { background: #222; border-radius: 6px; padding: 12px; margin-bottom: 15px; border-left: 3px solid #1DB954; }
        #debug-log { font-size: 11px; font-weight: 600; color: #ff5555; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="main-container" id="main-widget">
        <!-- IZQUIERDA -->
        <div class="logo-section">
            <div class="logo-base"></div>
            <div class="logo-shimmer"></div>
            <div class="cover-circle">
                <div class="album-cover" id="cover"></div>
                <div class="cover-overlay"></div>
                <div class="spectrum-container">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.5s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                    <div class="bar" style="animation-delay: 0.4s"></div>
                </div>
            </div>
            <div class="glass-ring"></div>
        </div>

        <!-- DERECHA -->
        <div class="info-section">
            <div class="artist-name" id="artist-text">SISTEMA</div>
            <div class="song-title" id="title-text">Cargando...</div>
            
            <div class="progress-container">
                <div class="progress-bg">
                    <div class="progress-fill" id="bar-fill">
                        <div class="emblem-marker"></div>
                    </div>
                </div>
                <div class="time-row">
                    <span id="time-start">00:00</span>
                    <span id="time-end">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL CONFIG -->
    <div class="config-overlay" id="config-ui">
        <div class="config-card">
            <h3 style="text-align:center; font-size: 16px; margin: 0 0 15px 0;">⚙️ PANEL DE CONTROL</h3>
            
            <h4>COLORES DE MARCA</h4>
            <div style="display: flex; gap: 10px;">
                <input type="color" id="c1" class="config-color" value="#00AEFF">
                <input type="color" id="c2" class="config-color" value="#0062FF">
            </div>

            <h4>1. TU CLIENT ID DE SPOTIFY</h4>
            <input type="text" id="spotify-client-id" class="config-input" placeholder="Pega aquí tu Client ID">

            <h4>2. ESTADO DE CONEXIÓN</h4>
            <div id="spotify-status-box">
                <div style="font-size: 11px; color: #ccc;">Esperando vinculación...</div>
            </div>
            
            <button class="btn-spotify" id="btn-spotify">VINCULAR SPOTIFY</button>
            <button class="btn-spotify" id="btn-spotify-logout" style="background:#cc0000; display:none;">DESCONECTAR</button>

            <button class="save-btn" id="save-cfg">CERRAR Y GUARDAR</button>
            <div id="debug-log"></div>
        </div>
    </div>

    <script>
        // CORE CONSTANTS
        const REFRESH_RATE = 2000;
        const REDIRECT_URI = "https://caortiz-stack.github.io/hosting/spotifyobs.html";

        // =========================================
        // MOTOR ESPECIAL DE OBS (EXTRACCIÓN DE TOKEN POR URL)
        // Esto permite pasar la sesión de Chrome a OBS
        // =========================================
        const urlParams = new URLSearchParams(window.location.search);
        const urlRefreshToken = urlParams.get('refresh_token');
        const urlClientId = urlParams.get('client_id');

        if (urlRefreshToken && urlClientId) {
            // Guardar datos silenciosamente en OBS
            localStorage.setItem('spotify_refresh', urlRefreshToken);
            localStorage.setItem('spotify_client_id', urlClientId);
            
            // Limpiar la URL para que no quede estorbando visualmente
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // UI ELEMENTS
        const widget = document.getElementById('main-widget');
        const cover = document.getElementById('cover');
        const artistEl = document.getElementById('artist-text');
        const titleEl = document.getElementById('title-text');
        const timeStartEl = document.getElementById('time-start');
        const timeEndEl = document.getElementById('time-end');
        const debugLog = document.getElementById('debug-log');
        const statusBox = document.getElementById('spotify-status-box');

        let currentId = "";
        let progressInterval = null;
        let currentMs = 0;
        let forceShowMessage = false;

        function fmt(ms) {
            if (!ms || isNaN(ms)) return "00:00";
            const s = Math.floor(ms / 1000);
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        // =========================================
        // UI & CONFIG MANAGEMENT
        // =========================================
        function updateUIStatus() {
            const hasRefresh = !!localStorage.getItem('spotify_refresh');
            const savedClientId = localStorage.getItem('spotify_client_id');
            
            if (hasRefresh && savedClientId) {
                document.getElementById('btn-spotify').style.display = 'none';
                document.getElementById('btn-spotify-logout').style.display = 'block';
                
                // Generamos el enlace mágico para OBS
                const obsLink = `${REDIRECT_URI}?refresh_token=${localStorage.getItem('spotify_refresh')}&client_id=${savedClientId}`;
                
                statusBox.innerHTML = `
                    <div style="color:#1DB954; font-weight:bold; margin-bottom:5px;">✅ ¡AUTORIZADO!</div>
                    <div style="font-size:10px; color:#fff; margin-bottom:5px; line-height: 1.3;">Copia este enlace exacto y pégalo como URL en tu Fuente de Navegador en OBS:</div>
                    <input type="text" value="${obsLink}" style="width:100%; padding:8px; font-size:9px; background:#000; color:#1DB954; border:1px solid #1DB954; border-radius:4px; font-family: monospace; outline: none; cursor: text;" onclick="this.select(); document.execCommand('copy'); alert('¡Enlace copiado para OBS!');" readonly>
                    <div style="font-size:9px; color:#aaa; margin-top:5px; text-align: center;">(Haz clic en el enlace para copiarlo)</div>
                `;
            } else {
                document.getElementById('btn-spotify').style.display = 'block';
                document.getElementById('btn-spotify-logout').style.display = 'none';
                statusBox.innerHTML = `<div style="font-size: 11px; color: #ccc;">No conectado. Dale a Vincular.</div>`;
                document.getElementById('config-ui').classList.add('show');
            }
        }

        function initCfg() {
            const root = document.documentElement.style;
            const savedC1 = localStorage.getItem('p_c1') || '#00AEFF';
            const savedC2 = localStorage.getItem('p_c2') || '#0062FF';
            const savedClientId = localStorage.getItem('spotify_client_id') || '5389f873bde54395a1fe2c4bd15bac0e'; // Default id

            root.setProperty('--theme-color-1', savedC1);
            root.setProperty('--theme-color-2', savedC2);
            document.getElementById('c1').value = savedC1;
            document.getElementById('c2').value = savedC2;
            document.getElementById('spotify-client-id').value = savedClientId;

            updateUIStatus();
        }

        document.getElementById('save-cfg').onclick = () => {
            const c1 = document.getElementById('c1').value;
            const c2 = document.getElementById('c2').value;
            
            localStorage.setItem('p_c1', c1);
            localStorage.setItem('p_c2', c2);
            
            // Solo guardamos el Client ID si el usuario escribió algo
            const inputId = document.getElementById('spotify-client-id').value.trim();
            if(inputId) localStorage.setItem('spotify_client_id', inputId);
            
            document.documentElement.style.setProperty('--theme-color-1', c1);
            document.documentElement.style.setProperty('--theme-color-2', c2);
            document.getElementById('config-ui').classList.remove('show');
        };

        document.getElementById('btn-spotify-logout').onclick = () => {
            localStorage.removeItem('spotify_access');
            localStorage.removeItem('spotify_refresh');
            window.location.reload();
        };

        document.body.ondblclick = () => document.getElementById('config-ui').classList.add('show');
        initCfg();

        // =========================================
        // SPOTIFY PKCE AUTH FLOW (REDRECCIÓN DIRECTA)
        // =========================================
        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
            return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        document.getElementById('btn-spotify').onclick = async () => {
            const btn = document.getElementById('btn-spotify');
            const clientId = document.getElementById('spotify-client-id').value.trim();
            
            if (!clientId) {
                debugLog.innerText = "❌ Ingresa tu Client ID primero.";
                return;
            }
            
            localStorage.setItem('spotify_client_id', clientId);
            
            const verifier = generateRandomString(128);
            localStorage.setItem('spotify_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);

            const url = new URL("https://accounts.spotify.com/authorize");
            url.searchParams.append("client_id", clientId);
            url.searchParams.append("response_type", "code");
            url.searchParams.append("redirect_uri", REDIRECT_URI);
            url.searchParams.append("code_challenge_method", "S256");
            url.searchParams.append("code_challenge", challenge);
            // Scopes exactos solicitados
            url.searchParams.append("scope", "user-read-email user-read-private user-modify-playback-state user-read-currently-playing user-read-playback-state");
            url.searchParams.append("state", generateRandomString(16));

            btn.innerText = "⏳ REDIRIGIENDO...";
            
            // Navegamos directamente a Spotify en la misma ventana
            window.location.href = url.toString();
        };

        // Procesar el código OAuth cuando Spotify nos redirige de vuelta
        async function checkSpotifyCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');

            if (error) {
                document.getElementById('config-ui').classList.add('show');
                debugLog.innerText = "Error: " + error;
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            if (code) {
                document.getElementById('config-ui').classList.add('show');
                debugLog.style.color = "#1DB954";
                debugLog.innerText = "⏳ Validando credenciales con Spotify...";

                const verifier = localStorage.getItem('spotify_verifier');
                const clientId = localStorage.getItem('spotify_client_id');
                
                const body = new URLSearchParams({
                    grant_type: 'authorization_code', 
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    client_id: clientId,
                    code_verifier: verifier
                });

                try {
                    const res = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/x-www-form-urlencoded' 
                        }, 
                        body: body.toString()
                    });
                    const data = await res.json();
                    
                    if (data.access_token) {
                        localStorage.setItem('spotify_access', data.access_token);
                        localStorage.setItem('spotify_refresh', data.refresh_token);
                        
                        // Limpiamos la URL de retorno
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        debugLog.innerText = "";
                        updateUIStatus(); // Mostrará el enlace mágico para OBS
                        
                    } else {
                        debugLog.style.color = "#ff5555";
                        debugLog.innerText = "❌ Error: Verifica que la URL del navegador sea exactamente igual a la registrada en Spotify Developer.";
                    }
                } catch(e) { 
                    debugLog.style.color = "#ff5555";
                    debugLog.innerText = "❌ Error de red: " + e.message;
                }
            }
        }
        
        checkSpotifyCallback();

        async function refreshSpotifyToken() {
            const refresh = localStorage.getItem('spotify_refresh');
            const clientId = localStorage.getItem('spotify_client_id');
            
            if (!refresh || !clientId) return false;

            const body = new URLSearchParams({ 
                grant_type: 'refresh_token', 
                refresh_token: refresh,
                client_id: clientId
            });
            
            try {
                const res = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST', 
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }, 
                    body: body.toString()
                });
                const data = await res.json();
                
                if (data.access_token) {
                    localStorage.setItem('spotify_access', data.access_token);
                    if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token);
                    return true;
                }
            } catch(e) {}
            
            return false;
        }

        // =========================================
        // PLAYER LOGIC (TRACK SYNC & UI)
        // =========================================
        function hideWidget() {
            if (widget.classList.contains('active') && !forceShowMessage) {
                widget.classList.remove('active');
                clearInterval(progressInterval);
                currentId = "";
            }
        }

        function syncTrackUI(title, artist, imgUrl, durMs, progMs) {
            forceShowMessage = false; 
            
            const safeTitle = String(title || "Sin título");
            const safeArtist = String(artist || "Desconocido");
            const newId = (safeTitle + safeArtist).toLowerCase();

            if (currentId !== "" && currentId !== newId && widget.classList.contains('active')) {
                widget.classList.remove('active');
                setTimeout(() => syncTrackUI(title, artist, imgUrl, durMs, progMs), 800);
                return;
            }

            if (currentId !== newId) {
                currentId = newId;
                artistEl.innerText = safeArtist;
                titleEl.innerText = safeTitle;
                
                // Ajuste de texto adaptable
                const len = safeTitle.length;
                titleEl.style.fontSize = len > 50 ? "3.8vh" : len > 35 ? "4.8vh" : "5.8vh";
                
                if (imgUrl) cover.style.backgroundImage = `url('${imgUrl}')`;
                widget.classList.add('active');
            }

            clearInterval(progressInterval);
            currentMs = progMs || 0;
            const totalDur = durMs || 180000;
            timeEndEl.innerText = fmt(totalDur);

            progressInterval = setInterval(() => {
                currentMs += 1000;
                const p = Math.min(1, currentMs / totalDur);
                document.documentElement.style.setProperty('--progress-width', `${p * 100}%`);
                timeStartEl.innerText = fmt(currentMs);
                if (p >= 1) clearInterval(progressInterval);
            }, 1000);
        }

        // =========================================
        // DATA FETCHING (SPOTIFY ONLY)
        // =========================================
        async function pollSpotify() {
            const token = localStorage.getItem('spotify_access');
            if (!token) return false;

            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    const refreshed = await refreshSpotifyToken();
                    return refreshed ? pollSpotify() : false;
                }

                if (res.status === 204) {
                    hideWidget();
                    return true;
                }

                if (res.status === 200) {
                    const data = await res.json();
                    
                    if (data && data.is_playing && data.item) {
                        const track = data.item;
                        const tName = track.name || "Desconocido";
                        const tArtist = track.artists ? track.artists.map(a => a.name).join(', ') : (track.show ? track.show.name : "Varios");
                        const tImg = track.album ? track.album.images[0]?.url : (track.images ? track.images[0]?.url : "");
                        
                        syncTrackUI(tName, tArtist, tImg, track.duration_ms, data.progress_ms);
                        return true;
                    } else {
                        hideWidget();
                        return true;
                    }
                }
            } catch (e) { return false; }
        }

        async function mainLoop() {
            // Lógica para auto-refrescar si detectamos token de OBS nuevo
            let token = localStorage.getItem('spotify_access');
            const refresh = localStorage.getItem('spotify_refresh');
            
            if (!token && refresh) {
                await refreshSpotifyToken();
                token = localStorage.getItem('spotify_access');
            }

            if (token) {
                await pollSpotify();
            } else {
                hideWidget();
            }
        }

        // Ejecución principal
        mainLoop();
        setInterval(mainLoop, REFRESH_RATE);
    </script>
</body>
</html>

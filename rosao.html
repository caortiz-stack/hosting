<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Rosado ❤️</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para traducir el código JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos personalizados -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #ffe4e6; }
        .font-script { font-family: 'Dancing Script', cursive; }
        
        .envelope-pattern {
            background-image: repeating-linear-gradient(45deg, transparent 0, transparent 10px, #fff1f2 10px, #fff1f2 20px);
        }
        
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pop-in {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes music-bar {
            0%, 100% { height: 10%; }
            50% { height: 100%; }
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); }
            50% { transform: translateY(50vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0); }
        }
        
        .animate-music-bar { animation: music-bar 0.5s ease-in-out infinite alternate; }
        .animate-fade-in-up { animation: fade-in-up 1s ease-out; }
        .animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-float { animation: float 10s linear infinite; }
        .animate-float-fast { animation: float 4s linear infinite; }
        
        /* Ocultar scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG (Reemplazo de lucide-react para que funcione sin build) ---
        const Heart = ({ size = 24, fill = "none", className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        const Clock = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        );

        const Star = ({ size = 24, fill = "none", className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );

        // --- COMPONENTES ---

        const FloatingHearts = ({ isPlaying }) => {
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    {[...Array(20)].map((_, i) => (
                        <div
                            key={i}
                            className={`absolute opacity-30 ${isPlaying ? 'animate-float-fast' : 'animate-float'}`}
                            style={{
                                left: `${Math.random() * 100}%`,
                                top: `${Math.random() * 100}%`,
                                animationDelay: `${Math.random() * 5}s`,
                                animationDuration: isPlaying ? `${3 + Math.random() * 5}s` : `${8 + Math.random() * 10}s`,
                            }}
                        >
                            <Heart 
                                size={Math.random() * 20 + 10} 
                                fill="#ec4899" 
                                className="text-pink-500" 
                            />
                        </div>
                    ))}
                </div>
            );
        };

        const AudioVisualizer = ({ isPlaying }) => {
            if (!isPlaying) return null;
            return (
                <div className="flex items-end justify-center gap-1 h-6 w-full mt-4 px-8 opacity-60">
                    {[...Array(15)].map((_, i) => (
                        <div
                            key={i}
                            className={`w-1.5 bg-pink-400 rounded-t-sm transition-all duration-150 ${isPlaying ? 'animate-music-bar' : 'h-1'}`}
                            style={{
                                height: isPlaying ? `${Math.random() * 100}%` : '4px',
                                animationDelay: `${i * 0.05}s`,
                                animationDuration: '0.6s'
                            }}
                        />
                    ))}
                </div>
            );
        };

        function TimeUnit({ value, label }) {
            return (
                <div className="flex flex-col items-center w-12">
                    <span className="text-xl font-bold text-pink-600 font-mono leading-none">
                        {value}
                    </span>
                    <span className="text-[9px] text-gray-400 uppercase mt-1">{label}</span>
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [isOpened, setIsOpened] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [timeElapsed, setTimeElapsed] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const audioRef = useRef(null);

            // FECHA DE INICIO
            const startDate = new Date('2024-01-01T00:00:00');

            // URL del Audio (MP3 Directo proporcionado)
            const audioUrl = "https://github.com/caortiz-stack/rosao/raw/refs/heads/main/Enjambre%20-%20La%20Diferencia%20(Video%20oficial)%20%5Bt3-pKHeiu1M%5D.mp3";

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = now.getTime() - startDate.getTime();

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                    setTimeElapsed({ days, hours, minutes, seconds });
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            const handleOpenLetter = () => {
                setIsOpened(true);
                if (audioRef.current) {
                    audioRef.current.volume = 0.6; // Volumen agradable
                    const playPromise = audioRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => setIsPlaying(true))
                            .catch(error => {
                                console.log("Autoplay bloqueado:", error);
                            });
                    }
                }
            };

            const handleAudioEnded = () => {
                setIsPlaying(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-rose-100 via-pink-100 to-rose-200 text-gray-800 font-sans relative overflow-hidden flex items-center justify-center p-4">
                    <FloatingHearts isPlaying={isPlaying} />
                    
                    {/* Reproductor de Audio Nativo (Invisible) */}
                    <audio 
                        ref={audioRef} 
                        src={audioUrl} 
                        onEnded={handleAudioEnded}
                        preload="auto"
                    />

                    {/* Pantalla Intro (Carta) */}
                    {!isOpened ? (
                        <div 
                            onClick={handleOpenLetter}
                            className="cursor-pointer transform transition-transform duration-500 hover:scale-105 z-20 flex flex-col items-center justify-center animate-fade-in-up"
                        >
                            <div className="relative bg-white w-72 h-48 rounded-lg shadow-2xl flex items-center justify-center border-2 border-pink-200 envelope-pattern">
                                <div className="absolute -top-12 left-0 w-0 h-0 border-l-[144px] border-r-[144px] border-b-[100px] border-l-transparent border-r-transparent border-b-pink-200 filter drop-shadow-sm"></div>
                                <Heart size={48} fill="#ec4899" className="text-pink-500 z-10 animate-pulse drop-shadow-lg" />
                                <div className="absolute bottom-4 font-script text-2xl text-rose-500">Para Rosado</div>
                            </div>
                            <p className="mt-8 text-rose-600 font-medium animate-bounce text-sm uppercase tracking-wider">
                                Toca para abrir
                            </p>
                        </div>
                    ) : (
                        /* Contenido Principal */
                        <div className="w-full max-w-sm bg-white/90 backdrop-blur-md rounded-[2rem] shadow-xl border border-white/60 overflow-hidden relative z-10 animate-pop-in flex flex-col max-h-[90vh]">
                            
                            {/* Encabezado con Foto - Efecto Scrapbook */}
                            <div className="relative h-64 bg-pink-100 shrink-0 flex items-center justify-center p-4 overflow-hidden">
                                <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'radial-gradient(#ec4899 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
                                
                                <div className={`relative transform transition-all duration-500 z-10 ${isPlaying ? 'scale-[1.02]' : '-rotate-3'}`}>
                                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-6 bg-white/40 backdrop-blur-sm shadow-sm z-20 transform -rotate-2 border-l border-r border-white/20"></div>
                                    
                                    <div className={`bg-white p-3 shadow-xl transition-shadow duration-300 ${isPlaying ? 'shadow-pink-400/50' : ''}`} style={{ 
                                        clipPath: 'polygon(2% 0%, 98% 1%, 100% 98%, 1% 99%)',
                                        borderRadius: '2px'
                                    }}>
                                        <img 
                                            src="https://scontent.fgye1-2.fna.fbcdn.net/v/t39.30808-6/514007735_732127176642087_8004359617078088970_n.jpg?stp=dst-jpg_s1080x2048_tt6&_nc_cat=101&ccb=1-7&_nc_sid=bdeb5f&_nc_ohc=rtRln_xfXr4Q7kNvwFRmzLo&_nc_oc=Adl3wSeeXkHWxSGLr8jIgvfHJRhvz5XCDrflispbN0Dt76qmw6a0og-BQSNm6B9bck13y4Z_E8ykML4OxL3mtPXk&_nc_zt=23&_nc_ht=scontent.fgye1-2.fna&_nc_gid=gJZrTcwZj6VTZHjwzVxQTw&oh=00_AfsGyvVFRQpqYBiQEDTvQqNQtXKGMcg-LrVIT6I5HV0ynw&oe=6995BAD2"
                                            alt="Nosotros" 
                                            className="w-56 h-48 object-cover filter contrast-110 sepia-[.1]"
                                        />
                                        <div className="mt-2 text-center flex items-center justify-center gap-2">
                                            <p className="font-script text-gray-500 text-lg">Rosado & Yo</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="p-5 space-y-4 overflow-y-auto no-scrollbar">
                                
                                <div className="text-center">
                                    <p className="text-gray-600 text-sm leading-relaxed font-medium">
                                        "Te conocí un <span className="text-pink-600 font-bold">1 de enero</span>. 
                                        Aunque para mí el tiempo ya no tiene medida cuando estoy contigo..."
                                    </p>
                                    <h2 className="text-2xl font-script text-rose-500 mt-2 transform -rotate-2">
                                        ¡Feliz San Valentín!
                                    </h2>
                                </div>

                                <div className="bg-pink-50/80 rounded-2xl p-3 border border-pink-100">
                                    <div className="flex items-center justify-center gap-2 mb-2 text-pink-400">
                                        <Clock size={14} />
                                        <span className="text-[10px] uppercase tracking-widest font-bold">Tiempo Juntos</span>
                                    </div>
                                    <div className="flex justify-between items-center px-2">
                                        <TimeUnit value={timeElapsed.days} label="Días" />
                                        <div className="text-pink-300 text-xl font-light">:</div>
                                        <TimeUnit value={timeElapsed.hours} label="Hrs" />
                                        <div className="text-pink-300 text-xl font-light">:</div>
                                        <TimeUnit value={timeElapsed.minutes} label="Min" />
                                        <div className="text-pink-300 text-xl font-light">:</div>
                                        <TimeUnit value={timeElapsed.seconds} label="Seg" />
                                    </div>
                                </div>

                                <div className="pb-2">
                                    <AudioVisualizer isPlaying={isPlaying} />
                                    <div className="flex justify-center mt-2">
                                        <span className="inline-flex items-center gap-2 text-xs text-rose-400 font-medium px-4 py-1 bg-white rounded-full shadow-sm border border-pink-100">
                                            <Star size={12} fill="currentColor" />
                                            Eres el amor de mi vida
                                            <Star size={12} fill="currentColor" />
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

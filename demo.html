<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE SEGURIDAD - VISTA CONFIDENCIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo total de interacción y selección */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Marcas de agua */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            opacity: 0.08;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        #pdf-container {
            width: 100%;
            height: 100%;
            background: #000;
        }

        #pdf-object {
            width: 100%;
            height: 100%;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #333;
            font-family: sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="loader">INICIALIZANDO PROTOCOLO DE SEGURIDAD...</div>

    <div class="watermark-layer" id="watermark-container"></div>

    <div id="pdf-container"></div>

    <script>
        /**
         * 1. RECONSTRUCCIÓN DINÁMICA DE RUTA (Ofuscación de String)
         * Se actualiza el nombre del archivo a "2plano.pdf" usando Base64.
         */
        const _0x4a21 = ["MnBsYW5v", "LnBkZg=="]; // "2plano" y ".pdf" en base64
        const _p = atob(_0x4a21[0]) + atob(_0x4a21[1]);

        async function initSecureStream() {
            try {
                // Descarga el archivo como datos binarios puros (buffer)
                const response = await fetch(_p);
                if (!response.ok) throw new Error();
                
                const dataBuffer = await response.arrayBuffer();
                
                // Conversión de Buffer a Blob de tipo aplicación/pdf
                const blob = new Blob([dataBuffer], { type: 'application/pdf' });
                const secureUrl = URL.createObjectURL(blob);
                
                const container = document.getElementById('pdf-container');
                const viewer = document.createElement('object');
                
                viewer.id = 'pdf-object';
                // Parámetros de visualización forzados para ocultar herramientas nativas
                viewer.data = `${secureUrl}#toolbar=0&navpanes=0&pagemode=none&view=FitW`;
                viewer.type = 'application/pdf';
                
                container.appendChild(viewer);
                document.getElementById('loader').style.display = 'none';

                // Revocación de URL para evitar extracción posterior
                setTimeout(() => {
                    URL.revokeObjectURL(secureUrl);
                }, 5000);
                
            } catch (e) {
                document.getElementById('loader').innerText = "ERROR DE ACCESO: RECURSO NO ENCONTRADO";
                document.getElementById('loader').style.color = "#500";
            }
        }

        /**
         * 2. BLOQUEO DE INTERACCIÓN PERIMETRAL
         */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            const forbidden = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && forbidden.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 3. MARCAS DE AGUA DINÁMICAS
         */
        const wContainer = document.getElementById('watermark-container');
        for (let i = 0; i < 20; i++) {
            const d = document.createElement('div');
            d.className = 'watermark-item';
            d.innerText = "CONFIDENCIAL - PROYECTO RIO GRANDE";
            wContainer.appendChild(d);
        }

        /**
         * 4. ANTI-DEBUGGING AVANZADO
         */
        (function() {
            const n = () => {};
            ['log', 'info', 'warn', 'error', 'table'].forEach(m => console[m] = n);
            
            setInterval(() => {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 50) {
                    // Acción si se detecta consola abierta
                }
                console.clear();
            }, 500);
        })();

        window.onload = initSecureStream;
    </script>
</body>
</html>

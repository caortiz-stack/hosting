<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SISTEMA DE SEGURIDAD - VISTA CONFIDENCIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo total de interacción y selección */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            position: fixed;
            left: 0;
            top: 0;
        }

        /* Capa superior invisible: Impide que el dedo toque el visor real */
        .touch-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 250;
            background: rgba(0,0,0,0);
        }

        /* Marcas de agua optimizadas para planos */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 1fr);
            opacity: 0.15;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            white-space: pre-line;
        }

        #pdf-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Iframe seguro sin controles nativos */
        #secure-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: #555;
            font-family: ui-monospace, monospace;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* Prevenir visualización en impresión */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="loader">AUTORIZANDO TERMINAL MÓVIL...</div>

    <!-- Escudo de toque: Evita el menú contextual del sistema operativo -->
    <div class="touch-shield"></div>

    <div class="watermark-layer" id="watermark-container"></div>

    <div id="pdf-wrapper"></div>

    <script>
        /**
         * 1. RECONSTRUCCIÓN DE RUTA Y CARGA BINARIA (Ofuscado)
         */
        const _0x1a2b = ["MnBsYW5v", "LnBkZg=="]; 
        const _target = atob(_0x1a2b[0]) + atob(_0x1a2b[1]);

        async function initProtectedViewer() {
            try {
                // Descarga binaria para evitar que el navegador lo identifique como descarga de archivo
                const response = await fetch(_target);
                if (!response.ok) throw new Error();
                
                const buffer = await response.arrayBuffer();
                // Bloqueamos el tipo MIME para que no se disparen manejadores externos de PDF
                const blob = new Blob([buffer], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                
                const wrapper = document.getElementById('pdf-wrapper');
                
                // Usamos un iframe con sandbox para neutralizar la barra inferior de descarga
                const frame = document.createElement('iframe');
                frame.id = 'secure-frame';
                // El sandbox bloquea explícitamente descargas y apertura de popups
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
                // Forzamos el visor interno de Chrome/Safari mediante parámetros
                frame.src = `${blobUrl}#toolbar=0&navpanes=0&pagemode=none&view=FitW&scrollbar=0`;
                
                wrapper.appendChild(frame);
                
                // Ocultar cargador con suavizado
                setTimeout(() => {
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                }, 1000);

                // Auto-revocación del enlace para que no se pueda copiar/pegar
                setTimeout(() => {
                    URL.revokeObjectURL(blobUrl);
                }, 2000);
                
            } catch (err) {
                document.getElementById('loader').innerText = "ERROR: ACCESO RESTRINGIDO";
                document.getElementById('loader').style.color = "#ff3333";
            }
        }

        /**
         * 2. BLOQUEO DE GESTOS Y MENÚS NATIVOS
         */
        // Prevenir scroll, zoom y menús de sistema en móviles
        document.addEventListener('touchstart', e => {
            if (e.touches.length > 1) e.preventDefault(); // Bloquea pinch-zoom
        }, { passive: false });

        document.addEventListener('touchmove', e => {
            e.preventDefault(); // Bloquea scroll y swipe-to-refresh
        }, { passive: false });

        // Bloqueo total de clic derecho y pulsación larga
        window.oncontextmenu = function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        };

        /**
         * 3. BLOQUEO DE TECLADO E INSPECCIÓN (Escritorio)
         */
        document.addEventListener('keydown', e => {
            const keys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && keys.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || e.key === 'PrintScreen' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 4. GENERACIÓN DE MARCAS DE AGUA DINÁMICAS
         */
        const wContainer = document.getElementById('watermark-container');
        for (let i = 0; i < 24; i++) {
            const item = document.createElement('div');
            item.className = 'watermark-item';
            item.innerText = "ACCESO TEMPORAL\nRIO GRANDE";
            wContainer.appendChild(item);
        }

        /**
         * 5. ANTI-INSPECCIÓN AVANZADA
         */
        (function() {
            const noop = () => {};
            ['log', 'info', 'warn', 'error', 'table'].forEach(m => console[m] = noop);
            
            setInterval(() => {
                const now = performance.now();
                debugger;
                if (performance.now() - now > 50) {
                    // Si se detecta pausa por debugger, se limpia la sesión
                    document.body.innerHTML = "";
                    location.reload();
                }
            }, 800);
        })();

        window.onload = initProtectedViewer;
    </script>
</body>
</html>

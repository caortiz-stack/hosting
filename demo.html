<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- FORZAR MODO ESCRITORIO: Fijamos el ancho a 1280px en lugar de device-width -->
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>SISTEMA DE SEGURIDAD - VISTA CONFIDENCIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo de selección pero permitiendo scroll */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            /* Permitimos scroll en ambos ejes para el modo escritorio */
            touch-action: pan-x pan-y; 
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 1280px; /* Ancho fijo de escritorio */
            height: 100%;
            background-color: #000;
            overflow: hidden; 
        }

        /* Capa superior: Bloquea menús pero deja pasar el scroll */
        .touch-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 250;
            background: rgba(0,0,0,0);
            pointer-events: none; 
        }

        /* Marcas de agua */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(10, 1fr);
            opacity: 0.1;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Contenedor principal con scroll habilitado */
        #pdf-wrapper {
            width: 1280px;
            height: 100vh;
            background: #000;
            z-index: 50;
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
        }

        #secure-viewer {
            width: 100%;
            height: 2000px; /* Altura extendida para forzar scroll de escritorio */
            border: none;
            background: #000;
            display: block;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: #555;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 2px;
            transition: opacity 0.5s ease;
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="loader">FORZANDO MODO ESCRITORIO...</div>

    <div class="touch-shield"></div>

    <div class="watermark-layer" id="watermark-container"></div>

    <div id="pdf-wrapper">
        <!-- El visor se inyectará aquí -->
    </div>

    <script>
        const _0x1a2b = ["MnBsYW5v", "LnBkZg=="]; 
        const _target = atob(_0x1a2b[0]) + atob(_0x1a2b[1]);

        async function initProtectedViewer() {
            try {
                const response = await fetch(_target);
                if (!response.ok) throw new Error('Error');
                
                const buffer = await response.arrayBuffer();
                const blob = new Blob([buffer], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                
                const wrapper = document.getElementById('pdf-wrapper');
                
                // Usamos iframe con sandbox para evitar que el móvil "sepa" que es un PDF descargable
                const viewer = document.createElement('iframe');
                viewer.id = 'secure-viewer';
                viewer.setAttribute('sandbox', 'allow-scripts allow-same-origin');
                // Parámetros de escritorio: forzamos zoom al 100% y ocultamos barras laterales
                viewer.src = `${blobUrl}#toolbar=0&navpanes=0&pagemode=none&view=FitH,0&zoom=100`;
                
                wrapper.innerHTML = ''; 
                wrapper.appendChild(viewer);
                
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 1500);

            } catch (err) {
                document.getElementById('loader').innerText = "ERROR DE CARGA";
            }
        }

        // Bloqueo de menús contextuales
        window.oncontextmenu = function(e) {
            e.preventDefault();
            return false;
        };

        // Bloqueo de teclado
        document.addEventListener('keydown', e => {
            const keys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if ((e.ctrlKey || e.metaKey) && keys.includes(e.key.toLowerCase())) e.preventDefault();
        });

        // Marcas de agua
        const wContainer = document.getElementById('watermark-container');
        for (let i = 0; i < 40; i++) {
            const item = document.createElement('div');
            item.className = 'watermark-item';
            item.innerText = "SITIO ESCRITORIO\nRIO GRANDE";
            wContainer.appendChild(item);
        }

        window.onload = initProtectedViewer;
    </script>
</body>
</html>

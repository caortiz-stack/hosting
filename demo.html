<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa de Planos - Confidencial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo total de interacción y selección */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }

        /* Capa de Marcas de Agua sutiles */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            opacity: 0.05;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Visor a pantalla completa sin márgenes */
        #pdf-viewport {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
            display: block;
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <!-- Capa de Marcas de Agua -->
    <div class="watermark-layer" id="watermark-container"></div>

    <!-- Visor de PDF.js configurado para carga local en GitHub Pages -->
    <!-- El archivo debe estar en la misma carpeta que demo.html y llamarse planos.pdf -->
    <iframe 
        id="pdf-viewport"
        src="https://raw.githack.com/mozilla/pdf.js/master/web/viewer.html?file=planos.pdf#toolbar=0&navpanes=0&pagemode=none&view=FitW"
        allow="none">
    </iframe>

    <script>
        /**
         * 1. PROTECCIÓN DE INTERACCIÓN SILENCIOSA
         */
        
        // Bloqueo de clic derecho
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Bloqueo de teclas de guardado e inspección
        document.addEventListener('keydown', e => {
            const forbiddenKeys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && forbiddenKeys.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                e.key === 'PrintScreen'
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 2. GENERACIÓN DE MARCAS DE AGUA
         */
        const container = document.getElementById('watermark-container');
        const text = "RIO GRANDE - VISTA PREVIA";
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'watermark-item';
            div.innerText = text;
            container.appendChild(div);
        }

        /**
         * 3. ANTI-DEBUGGER SILENCIOSO
         */
        (function() {
            const empty = () => {};
            const methods = ['log', 'info', 'warn', 'error', 'dir', 'clear', 'table', 'debug'];
            methods.forEach(m => console[m] = empty);

            setInterval(function() {
                const startTime = performance.now();
                debugger;
                console.clear();
            }, 1000);
        })();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa de Planos - Confidencial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo total de interacción y selección */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Capa de Marcas de Agua */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            opacity: 0.08;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Contenedor del Visor */
        .pdf-container {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #pdf-object {
            width: 100%;
            height: 100%;
        }

        /* Estado de carga */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #444;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="loader">CARGANDO PLANOS SEGURIZADOS...</div>

    <div class="watermark-layer" id="watermark-container"></div>

    <div class="pdf-container" id="container">
        <!-- El contenido se inyectará dinámicamente mediante JavaScript -->
    </div>

    <script>
        /**
         * 1. CARGA SEGURA MEDIANTE BLOB (OCULTA URL REAL)
         */
        async function loadProtectedPDF() {
            // Nombre real del archivo (solo existe en esta variable de JS)
            const secretPath = 'planos.pdf'; 
            
            try {
                const response = await fetch(secretPath);
                if (!response.ok) throw new Error('Archivo no encontrado');
                
                const blob = await response.blob();
                // Creamos una URL temporal que no revela la ruta real
                const blobUrl = URL.createObjectURL(blob);
                
                const container = document.getElementById('container');
                const obj = document.createElement('object');
                obj.id = 'pdf-object';
                // Añadimos parámetros para ocultar herramientas
                obj.data = `${blobUrl}#toolbar=0&navpanes=0&pagemode=none&view=FitW`;
                obj.type = 'application/pdf';
                
                container.appendChild(obj);
                document.getElementById('loader').style.display = 'none';
                
            } catch (err) {
                document.getElementById('loader').innerText = 'ERROR DE CARGA: VERIFIQUE ARCHIVO';
            }
        }

        /**
         * 2. PROTECCIÓN DE INTERACCIÓN
         */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            const forbiddenKeys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && forbiddenKeys.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                e.key === 'PrintScreen'
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 3. MARCAS DE AGUA
         */
        const watermarkContainer = document.getElementById('watermark-container');
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'watermark-item';
            div.innerText = "RIO GRANDE - CONFIDENCIAL";
            watermarkContainer.appendChild(div);
        }

        /**
         * 4. ANTI-DEBUGGER Y LIMPIEZA
         */
        (function() {
            const empty = () => {};
            ['log', 'info', 'warn', 'error', 'dir', 'clear', 'table'].forEach(m => console[m] = empty);
            
            setInterval(() => {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 100) { /* Consola abierta */ }
                console.clear();
            }, 1000);
        })();

        // Iniciar carga al cargar la ventana
        window.onload = loadProtectedPDF;
    </script>
</body>
</html>

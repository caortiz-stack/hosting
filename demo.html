<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>SISTEMA DE SEGURIDAD - VISTA CONFIDENCIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo de selección y arrastre, pero PERMITIENDO SCROLL */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
            /* Permitimos scroll vertical y horizontal para ver el plano */
            touch-action: pan-x pan-y; 
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            /* Quitamos fixed para permitir el scroll natural del contenedor */
            overflow: hidden; 
        }

        /* Capa superior: Bloquea clics derechos/largos pero deja pasar el scroll */
        .touch-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 250;
            background: rgba(0,0,0,0);
            /* Importante: permite que el scroll llegue al PDF pero bloquea interacciones de menú */
            pointer-events: none; 
        }

        /* Marcas de agua */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(8, 1fr);
            opacity: 0.12;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        #pdf-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 50;
            overflow: auto; /* Habilita el scroll en el contenedor */
            -webkit-overflow-scrolling: touch;
        }

        #secure-viewer {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            border: none;
            background: #000;
            display: block;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: #666;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 2px;
            transition: opacity 0.5s ease;
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <div id="loader">CARGANDO MODO ESCRITORIO SEGURO...</div>

    <!-- Escudo pasivo para bloquear menús contextuales -->
    <div class="touch-shield" id="shield"></div>

    <div class="watermark-layer" id="watermark-container"></div>

    <div id="pdf-wrapper"></div>

    <script>
        /**
         * 1. CONFIGURACIÓN DE RUTA (2plano.pdf)
         */
        const _0x1a2b = ["MnBsYW5v", "LnBkZg=="]; 
        const _target = atob(_0x1a2b[0]) + atob(_0x1a2b[1]);

        async function initProtectedViewer() {
            try {
                const response = await fetch(_target);
                if (!response.ok) throw new Error('Network error');
                
                const buffer = await response.arrayBuffer();
                const blob = new Blob([buffer], { type: 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);
                
                const wrapper = document.getElementById('pdf-wrapper');
                
                // Usamos 'embed' para forzar comportamiento de escritorio
                const viewer = document.createElement('embed');
                viewer.id = 'secure-viewer';
                // Añadimos parámetros para forzar la vista de escritorio y deshabilitar UI de descarga
                viewer.src = `${blobUrl}#toolbar=0&navpanes=0&pagemode=none&view=FitH`;
                viewer.type = 'application/pdf';
                
                wrapper.innerHTML = ''; 
                wrapper.appendChild(viewer);
                
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 1200);

            } catch (err) {
                document.getElementById('loader').innerText = "ERROR DE CONEXIÓN";
                document.getElementById('loader').style.color = "#ff4444";
            }
        }

        /**
         * 2. GESTIÓN DE INTERACCIÓN
         */
        // Permitimos gestos de scroll pero bloqueamos el menú contextual (pulsación larga)
        window.oncontextmenu = function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        };

        // Bloqueo de teclas de guardado/impresión
        document.addEventListener('keydown', e => {
            const keys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && keys.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || e.key === 'PrintScreen' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 3. MARCAS DE AGUA
         */
        const wContainer = document.getElementById('watermark-container');
        for (let i = 0; i < 24; i++) {
            const item = document.createElement('div');
            item.className = 'watermark-item';
            item.innerText = "ACCESO RESTRINGIDO\nRIO GRANDE";
            wContainer.appendChild(item);
        }

        /**
         * 4. ANTI-DEBUGGER
         */
        (function() {
            const noop = () => {};
            ['log', 'info', 'warn', 'error'].forEach(m => console[m] = noop);
            
            setInterval(() => {
                const now = performance.now();
                debugger;
                if (performance.now() - now > 50) {
                    location.reload();
                }
            }, 1500);
        })();

        window.onload = initProtectedViewer;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa de Planos - Confidencial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueo total de interacción y selección */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Capa de Marcas de Agua sutiles pero presentes */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            opacity: 0.08;
        }

        .watermark-item {
            transform: rotate(-30deg);
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Contenedor del Visor Nativo */
        .pdf-container {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Estilo para el objeto PDF */
        #pdf-object {
            width: 100%;
            height: 100%;
        }

        /* Mensaje de error si el archivo no existe */
        .fallback-msg {
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body ondragstart="return false;" ondrop="return false;">

    <!-- Capa de Marcas de Agua -->
    <div class="watermark-layer" id="watermark-container"></div>

    <!-- Visor de PDF Nativo (Elimina problemas de CORS) -->
    <div class="pdf-container">
        <!-- El archivo debe llamarse 'planos.pdf' y estar en el mismo nivel que demo.html -->
        <object 
            id="pdf-object"
            data="planos.pdf#toolbar=0&navpanes=0&pagemode=none&view=FitW" 
            type="application/pdf">
            <div class="fallback-msg">
                <p>Cargando planos...<br><span style="font-size: 10px;">Si el archivo no aparece, asegúrate de que 'planos.pdf' esté en el repositorio.</span></p>
            </div>
        </object>
    </div>

    <script>
        /**
         * 1. PROTECCIÓN DE INTERACCIÓN SILENCIOSA
         */
        
        // Bloqueo de clic derecho
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Bloqueo de teclas de guardado, impresión e inspección
        document.addEventListener('keydown', e => {
            const forbiddenKeys = ['s', 'p', 'u', 'i', 'j', 'c', 'k', 'a'];
            if (
                (e.ctrlKey || e.metaKey) && forbiddenKeys.includes(e.key.toLowerCase()) ||
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                e.key === 'PrintScreen'
            ) {
                e.preventDefault();
                return false;
            }
        });

        /**
         * 2. GENERACIÓN DE MARCAS DE AGUA
         */
        const container = document.getElementById('watermark-container');
        const text = "RIO GRANDE - CONFIDENCIAL";
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'watermark-item';
            div.innerText = text;
            container.appendChild(div);
        }

        /**
         * 3. ANTI-DEBUGGER SILENCIOSO
         */
        (function() {
            const empty = () => {};
            const methods = ['log', 'info', 'warn', 'error', 'dir', 'clear', 'table', 'debug'];
            methods.forEach(m => console[m] = empty);

            setInterval(function() {
                const startTime = performance.now();
                debugger;
                console.clear();
            }, 1000);
        })();

        /**
         * 4. AUTO-AJUSTE PARA MÓVILES
         */
        window.addEventListener('resize', () => {
            // El objeto se ajusta automáticamente mediante CSS
        });

    </script>
</body>
</html>
